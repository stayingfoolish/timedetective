id: https://github.com/stayingfoolish/timedetective/schema/core
name: timedetective_core
description: >-
  The TimeDetective ontology. Source of truth for what a procedure, a playbook
  and a Finding are. Instances live in knowledge/.
prefixes:
  linkml: https://w3id.org/linkml/
  td: https://github.com/stayingfoolish/timedetective/schema/core/
default_prefix: td
default_range: string
imports:
  - linkml:types

# Additive v0.1 implementation of docs/proposals, requested for the weather build.
# JSON payloads are strings so arbitrary procedure output cannot alter the ontology.

enums:
  SkillCategory:
    description: >-
      Skill type. A procedure's category is also its folder name under
      knowledge/procedures/, src/timedetective/skills/ and tests/skills/.
      Adding a value here is a schema change.
    permissible_values:
      diagnostics:
        description: Measures a property of a series; changes nothing.
      transforms:
        description: Returns a new series.
      trend:
        description: Tests for and sizes a monotonic change.
      changepoint:
        description: Finds when behavior changed.
      relationship:
        description: Relates two or more series.
      detectability:
        description: Says what this record is able to show.
      robustness:
        description: Re-tests a result another way.

  ClaimStrength:
    description: The claim-strength ladder. Only the critic assigns it.
    permissible_values:
      descriptive:
        description: A direction and a magnitude with an interval.
      significant:
        description: Beats a stated null model after the autocorrelation check.
      robust:
        description: Survives a second method and an independent record.

classes:
  Finding:
    attributes:
      schema_version: {required: true}
      question: {required: true}
      playbook: {required: true}
      subject: {range: SeriesRef, multivalued: true, inlined_as_list: true}
      claim: {range: Claim, inlined: true}
      path: {range: Step, multivalued: true, inlined_as_list: true}
      refusals: {range: FindingRefusal, multivalued: true, inlined_as_list: true}
      would_strengthen: {multivalued: true}
  Claim:
    attributes:
      statement_type: {required: true}
      statement: {required: true}
      strength: {range: ClaimStrength, required: true}
  SeriesRef:
    attributes:
      name: {required: true}
      units: {required: true}
      cadence: {required: true}
      source: {required: true}
      retrieved: {range: date, required: true}
      metadata_json: {required: true}
  Step:
    attributes:
      node: {required: true}
      procedure: {required: true}
      parameters_json: {required: true}
      values_json: {required: true}
      source: {required: true}
      edge_taken: {}
      edge_source: {}
  FindingRefusal:
    attributes:
      procedure: {required: true}
      failed: {required: true}
      would_change: {required: true}
  Playbook:
    attributes:
      name: {identifier: true, required: true}
      question: {required: true}
      domain: {required: true}
      start: {required: true}
      nodes: {range: Node, multivalued: true, inlined_as_list: true, required: true}
      edges: {range: Edge, multivalued: true, inlined_as_list: true, required: true}
  Node:
    attributes:
      id: {identifier: true, required: true}
      procedure: {}
      parameters_json: {}
      input: {}
      terminal: {}
  Edge:
    attributes:
      id: {identifier: true, required: true}
      origin: {required: true}
      target: {required: true}
      outcome: {required: true, description: 'ok, refused, or always; exactly one edge must match.'}
      domain: {required: true}
      source: {required: true}
  Dataset:
    attributes:
      name: {identifier: true, required: true}
      pack: {required: true}
      title: {required: true}
      plain_definition: {required: true}
      variable: {required: true}
      units: {required: true}
      provider: {required: true}
      product_id: {required: true}
      cadence: {required: true}
      analysis_cadence: {required: true}
      record_start: {range: date, required: true}
      spatial_resolution: {required: true}
      known_issues: {range: KnownIssue, multivalued: true, inlined_as_list: true}
      companions: {multivalued: true}
      source: {required: true}
  KnownIssue:
    attributes:
      kind: {required: true}
      start: {range: date}
      end: {range: date}
      effect: {required: true}
      handling: {required: true}
      source: {required: true}
  Procedure:
    description: >-
      One test, check or transform. Implemented by exactly one skill registered
      under the same name.
    attributes:
      name:
        identifier: true
        required: true
        description: Registry name; equals the YAML file name without extension.
      category:
        range: SkillCategory
        required: true
      description:
        description: One or two lines on what it does.
      requires:
        multivalued: true
        description: Properties that must hold before this procedure may run.
      produces:
        multivalued: true
        description: Properties this procedure adds to the state.
      source:
        required: true
        description: >-
          Key into knowledge/sources.yaml for the paper that defines it.
          Never invented; use TODO if the real paper is not yet in hand.
