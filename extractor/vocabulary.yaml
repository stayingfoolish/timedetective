# Vocabulary map for the literature extractor.
#
# Purpose: papers name the same procedure many ways. The extractor normalizes a
# phrase found in a paper to one registry name (or to a backlog entry) using this file.
#
# Reference vocabulary: Manokhin (2025), "Mastering Modern Time Series Forecasting"
# (sources.yaml: manokhin_2025). `in_book` lists the terms that occur verbatim in the
# book's text (checked by string search on 2026-11-14, case-insensitive). `not_in_book`
# lists terms seen in the applied literature that the book does not use; they are kept
# so the extractor can still match them, and they mark where the book cannot settle usage.
#
# Rules for the extractor:
#   1. Match the longest term first; short acronyms (MK, PW, FDR, ITA, SSA, EMD) only
#      count when the paper defines them.
#   2. A phrase that matches nothing is recorded as "unmapped" with its sentence, never guessed.
#   3. A match under `unregistered` goes to the backlog: the method exists in the
#      literature but no skill implements it yet.
#   4. Ambiguous terms are listed at the bottom and must be resolved from context.

