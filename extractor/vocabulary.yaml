ambiguous:
- term: modified Mann-Kendall
  could_mean:
  - mann_kendall_hamed_rao
  - mann_kendall_prewhitened
  - mann_kendall_tfpw
  resolve_by: the cited method paper (Hamed and Rao; Yue and Wang; von Storch) or the words variance correction
    / prewhitening
- term: prewhitening
  could_mean:
  - prewhiten
  - mann_kendall_prewhitened
  - mann_kendall_tfpw
  resolve_by: whether the trend was removed first (trend-free) and whether a test followed
- term: trend
  could_mean:
  - ols_trend
  - sens_slope
  - loess_trend
  - stl trend component
  resolve_by: whether a slope with units, a smoothed curve, or a decomposition component is reported
- term: anomaly
  could_mean:
  - anomaly (departure from climatology)
  - outlier_screen (unusual observation)
  resolve_by: climate papers mean the former; the book and monitoring papers usually mean the latter
- term: change point / breakpoint / regime shift / step change
  could_mean:
  - pettitt
  - cusum
  - segmented_regression
  - step_vs_trend
  - pelt
  - bfast
  resolve_by: the named test; if none is named, record as unmapped
- term: significant
  could_mean:
  - a p-value below a level
  - field significance after multiple testing
  resolve_by: whether a multiple-testing correction is described
- term: detrending
  could_mean:
  - detrend_linear
  - difference
  - deseasonalize_stl trend removal
  resolve_by: the stated method
- term: persistence
  could_mean:
  - autocorrelation (short memory)
  - hurst_exponent (long memory)
  resolve_by: whether AR(1) or a Hurst parameter is estimated
