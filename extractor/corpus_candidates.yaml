# Candidate papers for playbook distillation, found by a broad web search on 2026-11-14.
#
# Status of every entry: CANDIDATE. None has been opened and read in full, so none is in
# knowledge/sources.yaml yet. `access` records what the search result showed; confirm the
# licence on the paper itself before extracting. Paywalled papers are out of scope.
#
# Clusters are chosen for diversity of variable, method family and paper type, so that
# aggregated edges are not just one community's habit.
#
# type: applied (analyses a dataset), comparison (tests methods against each other),
#       method (defines or reviews a method)

groundwater_grace:
  - title: Trend analysis of GRACE-based groundwater storage anomaly, Tana sub-basin (Heliyon 10, e24474, 2024)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10845251/
    type: applied
    methods_seen: [modified Mann-Kendall, Sen's slope, validation against precipitation and in situ levels]
    access: open access, CC BY-NC-ND (stated in result)
  - title: Groundwater level and rainfall trends in Rajasthan, 2000-2021
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10835170/
    type: applied
    methods_seen: [modified Mann-Kendall, Spearman's rho, Pearson/Kendall/Spearman correlation with rainfall]
    access: open access via PubMed Central
  - title: Drivers and spatiotemporal changes in groundwater storage from GRACE across US aquifers (Scientific Reports)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6411996/
    type: applied
    methods_seen: [seasonal Mann-Kendall, Sen's slope, multiple linear regression, dominance analysis]
    access: open access via PubMed Central
    note: covers the High Plains aquifer; closest match to the Kansas demo
  - title: "When climate variability partly compensates for groundwater depletion: the GRACE signal in Morocco (J. Hydrol. Reg. Stud. 42, 101177, 2022)"
    url: https://hal.inrae.fr/hal-03747298/document
    type: applied
    methods_seen: [separating depletion episodes from recharge events]
    access: open access, CC BY-NC-ND (stated in result)
  - title: Comparative analysis of spatiotemporal variability of groundwater storage in Iraq using GRACE (Hydrology 12, 69)
    url: https://www.mdpi.com/2306-5338/12/4/69
    type: applied
    methods_seen: [Mann-Kendall, Sen's slope, comparison of GRACE solutions]
    access: MDPI, open access
  - title: Rainfall intensity, drought patterns and groundwater storage in the Guir aquifer, Morocco (E3S Web Conf., 2026)
    url: https://www.e3s-conferences.org/10.1051/e3sconf/202672601006
    type: applied
    methods_seen: [Innovative Trend Analysis]
    access: open access, CC BY 4.0 (stated in result)

