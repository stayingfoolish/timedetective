# Candidate papers for playbook distillation, found by a broad web search on 2026-11-14.
#
# Status of every entry: CANDIDATE. None has been opened and read in full, so none is in
# knowledge/sources.yaml yet. `access` records what the search result showed; confirm the
# licence on the paper itself before extracting. Paywalled papers are out of scope.
#
# Clusters are chosen for diversity of variable, method family and paper type, so that
# aggregated edges are not just one community's habit.
#
# type: applied (analyses a dataset), comparison (tests methods against each other),
#       method (defines or reviews a method)

