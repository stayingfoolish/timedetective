[project]
name = "timedetective"
version = "0.1.0"
description = "Turns a plain-language question about a time series into a defensible, cited Finding."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pymannkendall>=1.4.3",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timedetective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running checks such as the calibration run"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "linkml>=1.12.1",
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
    "streamlit>=1.67.0",
]
